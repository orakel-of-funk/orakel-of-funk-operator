- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-orakel-ofunk-org-v1alpha1-workloadhardeningcheck
  failurePolicy: Fail
  name: vworkloadhardeningcheck-v1alpha1.kb.io
  rules:
  - apiGroups:
    - orakel.ofunk.org
    apiVersions:
    - v1alpha1
